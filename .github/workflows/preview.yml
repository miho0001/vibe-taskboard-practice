# PR ごとにデプロイプレビューを作り、URL を PR にコメントする。
#
# 有効にする条件（講師側の設定）:
#   - リポジトリ変数   ENABLE_PREVIEW = true
#   - シークレット     CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# setup/setup-student.sh に環境変数として渡しておくと、自動で設定されます。
name: Deploy Preview

on:
  pull_request:

# プレビュー URL をコメントするために書き込み権限が必要
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # 設定が入っていないリポジトリでは何もしない（赤いバッジを出さないため）
    if: vars.ENABLE_PREVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # ブランチ名をそのまま使えないことがあるので、URL に使える文字だけに直す
      - name: ブランチ名を整える
        id: slug
        run: echo "value=$(echo '${{ github.head_ref }}' | tr '/_.' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-28)" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Pages にデプロイ
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ github.event.repository.name }} --branch=${{ steps.slug.outputs.value }}

      - name: プレビュー URL を PR にコメント
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ steps.slug.outputs.value }}.${{ github.event.repository.name }}.pages.dev`
            const marker = '<!-- deploy-preview -->'
            const body = [
              marker,
              '### ⚡ デプロイプレビュー',
              '',
              'この PR の変更だけを反映した確認用の環境です。',
              '',
              `| プレビュー | ${url} |`,
              '| --- | --- |',
              `| ブランチ | \`${{ github.head_ref }}\` |`,
              '',
              '#### 確認手順',
              '1. タスクを2件追加して、ブラウザをリロード → 残っているか',
              '2. チェックを入れてリロード → チェックが付いたままか',
              '3. 1件削除してリロード → 復活していないか',
            ].join('\n')

            // 同じコメントを増やさないよう、既にあれば書き換える
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
